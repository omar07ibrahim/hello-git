[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-dag-evidence-lab"
version = "0.1.0"
description = "A deterministic, dependency-free laboratory for inspecting real Git object graphs"
requires-python = ">=3.10"
authors = [{ name = "Omar Ibrahim" }]

[tool.setuptools]
packages = ["git_dag_lab"]
